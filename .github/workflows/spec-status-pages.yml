name: Publish Arbora specification status and architecture explorer

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/public_spec_report.py
      - scripts/requirement_progress.py
      - specs/**
      - .github/workflows/spec-status-pages.yml
  # The architecture explorer reads every repository's default branch at build
  # time, so the schedule is what keeps it current; a specs-changed dispatch
  # from the shared Pages workflow rebuilds sooner when a token is configured.
  schedule:
    - cron: '7,37 * * * *'
  repository_dispatch:
    types: [specs-changed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: org-spec-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout organization hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hub
          persist-credentials: false
      - name: Checkout medulla
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/medulla
          path: sources/epistemic-graph
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout scion-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/scion-sdk
          path: sources/agent-connector-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout meristem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/meristem
          path: sources/agent-utilities
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout arbora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/arbora
          path: sources/arbora
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout overstory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/overstory
          path: sources/agent-webui
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout repository-manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/repository-manager
          path: sources/repository-manager
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pipelines
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/pipelines
          path: sources/pipelines
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout tuig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/tuig
          path: sources/agent-terminal-ui
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout emerald-exchange
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/emerald-exchange
          path: sources/emerald-exchange
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout tunnel-manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/tunnel-manager
          path: sources/tunnel-manager
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout universal-skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/universal-skills
          path: sources/universal-skills
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout skill-graphs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/skill-graphs
          path: sources/skill-graphs
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout axil
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/axil
          path: sources/geniusbot
          fetch-depth: 0
          persist-credentials: false
      - name: Render from public committed specs
        run: |
          python hub/scripts/public_spec_report.py \
            --checkouts-root sources \
            --repo .github=hub \
            --repo medulla=sources/epistemic-graph \
            --repo meristem=sources/agent-utilities \
            --repo scion-sdk=sources/agent-connector-sdk \
            --repo overstory=sources/agent-webui \
            --repo tuig=sources/agent-terminal-ui \
            --repo axil=sources/geniusbot \
            --output hub/site/spec-status.html
      - name: Checkout architecture explorer generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/pipelines
          ref: main
          path: generator
          persist-credentials: false
          sparse-checkout: |
            scripts/__init__.py
            scripts/architecture_explorer
            pipelines_hooks/__init__.py
            pipelines_hooks/specs/__init__.py
            pipelines_hooks/specs/ids.py
            pipelines_hooks/specs/priority.py
            pipelines_hooks/specs/requirements_doc.py
      - name: Build architecture explorer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci --prefix generator/scripts/architecture_explorer --no-audit --no-fund
          python3 generator/scripts/architecture_explorer/build.py --mode github \
            --page hub/site/architecture/index.html
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: hub/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
