name: Runtime diagram drift

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check canonical source and published copies
        run: python3 scripts/sync_runtime_diagram.py --check-published
