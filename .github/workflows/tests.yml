name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Hub script tests
        run: python -m pytest -q tests
      - name: Front-door links and images
        run: python scripts/check_front_door.py

  ci-required:
    name: CI required
    if: always()
    needs: [pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done
